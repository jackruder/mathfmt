# The Python distribution of mathfmt: a wheel that carries the compiled
# binary and nothing else (maturin's `bin` bindings), so `pip install
# mathfmt-tex`, `uv tool install mathfmt-tex` or `pipx install mathfmt-tex`
# put a `mathfmt` command on PATH with no Rust toolchain. The name on PyPI is
# `mathfmt-tex` because `mathfmt` is another project's (Word equations).
# The version is Cargo's. Wheels for each platform are built by
# .github/workflows/wheels.yml on the GitHub mirror.

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "mathfmt-tex"
description = "A filter that enforces math-notation conventions in LaTeX source"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["latex", "math", "unicode", "formatter", "pre-commit"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jackruder/mathfmt"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
# The binary only; the library crate is compiled into it.
strip = true
